name: CI Build & Test

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  # Android / Web / 共享测试：可在 Linux runner 上完成
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        run: ./gradlew :app:androidApp:assembleDebug
        timeout-minutes: 20

      - name: Build Web
        run: ./gradlew :app:webApp:wasmJsBrowserDistribution
        timeout-minutes: 20

      # ⚠️⚠️ **所有有测试源的模块都要跑**。
      #    原来只有 `:app:composeApp:jvmTest` ⇒ 只跑了 **1** 个用例（`assertEquals(3,1+2)`）
      #    ⇒ `:shared`(26) / `:network`(21) / `:webview-parkwoocheol` 全都没进 CI
      #    ⇒ ⇒ **"CI 绿"不等于"测试跑过了"**。
      #    ⚠️ 加新模块时要**同时**把它的测试任务加进来，否则又是一轮空跑。
      #    ⚠️ `:webview` 从 T2.8 起也有测试源了（进度条判据 5 例）⇒ 一并加进来。
      - name: Unit Tests
        run: >-
          ./gradlew
          :app:composeApp:jvmTest
          :shared:jvmTest
          :network:jvmTest
          :webview-parkwoocheol:jvmTest
          :webview:jvmTest
          --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          # ⚠️ 用 `**/` 兜住所有模块的测试报告 —— 原来只指 composeApp 一个模块。
          path: '**/build/reports/tests/'
          retention-days: 7

  # Kotlin/Native 的 Apple 目标只能在 macOS 主机上编译
  ios-framework:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Build iOS Framework
        run: ./gradlew :app:composeApp:linkDebugFrameworkIosArm64
        timeout-minutes: 45
