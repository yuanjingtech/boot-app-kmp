name: CI Build & Test

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  # Android / Web / 共享测试：可在 Linux runner 上完成
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        run: ./gradlew :app:androidApp:assembleDebug
        timeout-minutes: 20

      - name: Build Web
        run: ./gradlew :app:webApp:wasmJsBrowserDistribution
        timeout-minutes: 20

      - name: Unit Tests
        run: ./gradlew :app:composeApp:jvmTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: app/composeApp/build/reports/tests/
          retention-days: 7

  # Kotlin/Native 的 Apple 目标只能在 macOS 主机上编译
  ios-framework:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Build iOS Framework
        run: ./gradlew :app:composeApp:linkDebugFrameworkIosArm64
        timeout-minutes: 45
