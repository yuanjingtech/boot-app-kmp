name: AI Review (MiniMax)

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  MINIMAX_BASE_URL: "https://api.minimax.chat/v1"
  MINIMAX_MODEL: "MiniMax-Text-01"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Skip reviews triggered by bots
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'claude[bot]' &&
      !contains(github.event.pull_request.title, '[skip-review]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Get PR diff
        id: diff
        run: |
          echo "diff=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- '*.kt' '*.kts' | head -c 120000)" >> $GITHUB_OUTPUT

      - name: Get changed files
        id: files
        run: |
          echo "files=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Review with MiniMax
        id: review
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ steps.files.outputs.files }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          # Create review prompt
          REVIEW_PROMPT=$(cat <<'PROMPT_EOF'
你是 Kotlin Multiplatform 项目的代码审查专家。请审查以下 PR 的变更：

PR 标题: ${PR_TITLE}
变更文件: ${CHANGED_FILES}

代码变更（仅展示前1000行）:
${PR_DIFF:0:100000}

请审查以下方面：
1. 架构一致性 - 单数据源、UDF、层级边界
2. 业务逻辑位置 - 不能在 composables 或 Android 组件中
3. 状态和模型边界 - 明确的 UI 状态，区分一次性事件
4. KMP source-set 正确性 - commonMain 应在所有目标平台有效
5. Compose/UI 性能 - 不必要的重组、缺少 keys
6. 协程/取消/并发问题
7. 回归风险 - 边界情况、错误处理
8. 新业务规则的测试覆盖

请以 JSON 格式输出审查结果：
{
  "summary": "总体评估",
  "high_issues": [{"file": "文件路径", "line": 行号, "issue": "问题描述"}],
  "medium_issues": [{"file": "文件路径", "line": 行号, "issue": "问题描述"}],
  "low_issues": [{"file": "文件路径", "line": 行号, "issue": "问题描述"}],
  "positive": "做得好的地方"
}

重要：
- 仅审查 Kotlin/KotlinScript 文件
- 不要应用任何修复
- 如果差异太大，只分析前 1000 行变更
PROMPT_EOF
          )

          # Make API call to MiniMax
          RESPONSE=$(curl -s -X POST "$MINIMAX_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $MINIMAX_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MINIMAX_MODEL\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"你是一个严格的代码审查专家，擅长 Kotlin、Kotlin Multiplatform 和 Jetpack Compose。\"},
                {\"role\": \"user\", \"content\": $(echo "$REVIEW_PROMPT" | jq -Rs .)}
              ],
              \"temperature\": 0.3,
              \"max_tokens\": 4000
            }")

          echo "Response: $RESPONSE" >> $GITHUB_STEP_SUMMARY

      - name: Post review comment
        if: success() && steps.review.outputs.response
        env:
          REVIEW_RESPONSE: ${{ steps.review.outputs.response }}
        run: |
          # Extract content from MiniMax response and post as PR comment
          CONTENT=$(echo '${{ steps.review.outputs.response }}' | jq -r '.choices[0].message.content' 2>/dev/null || echo "Review completed. Check workflow logs for details.")

          # Format as PR comment
          COMMENT_BODY=$(cat <<EOF
## MiniMax AI Review

### 审查结果

$CONTENT

---
*This review was generated by MiniMax AI*
EOF
          )

          # Post comment via GitHub API
          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $(echo $COMMENT_BODY | jq -Rs .)}"

      - name: Post summary
        if: always()
        run: |
          echo "## PR Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "- PR: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Title: ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY