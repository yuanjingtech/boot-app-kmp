name: AI Review (MiniMax)

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  MINIMAX_BASE_URL: "https://api.minimax.chat/v1"
  MINIMAX_MODEL: "MiniMax-Text-01"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'claude[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Get diff
        run: |
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- '*.kt' '*.kts' | head -c 100000)
          echo "$DIFF" > /tmp/pr_diff.txt
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | tr '\n' ' ')
          echo "FILES=$FILES" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Review
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEND'
import os, json, urllib.request

base_url = os.environ["MINIMAX_BASE_URL"]
model = os.environ["MINIMAX_MODEL"]
api_key = os.environ["MINIMAX_API_KEY"]

with open("/tmp/pr_diff.txt", "r") as f:
    diff = f.read()

files = os.environ.get("FILES", "")
pr_title = os.environ["PR_TITLE"]
pr_number = os.environ["PR_NUMBER"]
repo = os.environ["REPO"]

prompt = "你是 Kotlin Multiplatform 项目的代码审查专家。请审查以下 PR 的变更：\n\nPR 标题: " + pr_title + "\n变更文件: " + files + "\n\n代码变更：\n" + diff + "\n\n请审查以下方面：\n1. 架构一致性\n2. 业务逻辑位置\n3. KMP source-set 正确性\n4. Compose/UI 性能\n5. 协程/并发问题\n6. 回归风险\n\n请以 Markdown 格式输出审查结果，包含：总体评估、高/中/低严重性问题、做得好的地方。仅审查 Kotlin 文件，不要应用修复。"

messages = [
    {"role": "system", "content": "你是一个严格的代码审查专家。"},
    {"role": "user", "content": prompt}
]

payload = {"model": model, "messages": messages, "temperature": 0.3, "max_tokens": 4000}

req = urllib.request.Request(
    base_url + "/chat/completions",
    data=json.dumps(payload).encode("utf-8"),
    headers={"Authorization": "Bearer " + api_key, "Content-Type": "application/json"},
    method="POST"
)

with urllib.request.urlopen(req, timeout=60) as resp:
    result = json.loads(resp.read().decode("utf-8"))
    content = result.get("choices", [{}])[0].get("message", {}).get("content", "")
    body = "## MiniMax AI Review\n\n" + content + "\n\n---\n*This review was generated by MiniMax AI*\n"
    comment_req = urllib.request.Request(
        "https://api.github.com/repos/" + repo + "/issues/" + pr_number + "/comments",
        data=json.dumps({"body": body}).encode("utf-8"),
        headers={"Authorization": "token " + os.environ["GITHUB_TOKEN"], "Content-Type": "application/json"},
        method="POST"
    )
    with urllib.request.urlopen(comment_req) as comment_resp:
        print("Comment posted")
PYEND

      - name: Summary
        if: always()
        run: |
          echo "## PR Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "- PR: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Title: ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY