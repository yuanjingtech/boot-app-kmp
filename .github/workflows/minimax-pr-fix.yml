name: AI Fix (MiniMax)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  MINIMAX_BASE_URL: "https://api.minimax.chat/v1"
  MINIMAX_MODEL: "MiniMax-Text-01"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Only run when someone comments "@minimax fix" on a PR
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@minimax fix') &&
      github.event.comment.user.login != 'dependabot[bot]' &&
      github.event.comment.user.login != 'claude[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        run: |
          PR_DATA=$(curl -s "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
          echo "base_ref=$(echo $PR_DATA | jq -r '.base.ref')" >> $GITHUB_OUTPUT
          echo "head_ref=$(echo $PR_DATA | jq -r '.head.ref')" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        run: |
          git fetch origin ${{ steps.pr_info.outputs.base_ref }}
          git checkout ${{ steps.pr_info.outputs.head_ref }}

      - name: Get PR diff
        id: diff
        run: |
          echo "diff=$(git diff origin/${{ steps.pr_info.outputs.base_ref }}...HEAD -- '*.kt' '*.kts' | head -c 120000)" >> $GITHUB_OUTPUT

      - name: Analyze with MiniMax
        id: analyze
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          PR_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          # Create fix prompt
          FIX_PROMPT=$(cat <<'PROMPT_EOF'
你是 Kotlin Multiplatform 项目的代码修复专家。请分析以下 PR 的问题和修复建议。

PR 标题: ${PR_TITLE}
评论内容: ${COMMENT_BODY}

代码变更（部分）:
${PR_DIFF:0:80000}

请：
1. 识别 PR 中的关键问题
2. 提供具体的代码修复建议
3. 解释每个修复的原因

请以 JSON 格式返回：
{
  "identified_issues": [
    {"severity": "high|medium|low", "description": "问题描述", "files": ["文件路径"], "suggested_fix": "修复建议"}
  ],
  "fix_priority": ["高优先级修复列表"],
  "warnings": ["需要小心处理的事项"]
}
PROMPT_EOF
          )

          RESPONSE=$(curl -s -X POST "$MINIMAX_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $MINIMAX_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"$MINIMAX_MODEL\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"你是 Kotlin Multiplatform 和 Jetpack Compose 专家。\"},
                {\"role\": \"user\", \"content\": $(echo "$FIX_PROMPT" | jq -Rs .)}
              ],
              \"temperature\": 0.3,
              \"max_tokens\": 4000
            }")

          echo "Analysis response: $RESPONSE" >> $GITHUB_STEP_SUMMARY

      - name: Apply fixes
        if: steps.analyze.outputs.response
        env:
          ANALYSIS: ${{ steps.analyze.outputs.response }}
        run: |
          # Extract fixes from analysis
          ISSUES=$(echo '$ANALYSIS' | jq -r '.identified_issues // []')

          echo "## Applying Fixes" >> $GITHUB_STEP_SUMMARY
          echo "Found $(echo $ISSUES | jq length) issues to address" >> $GITHUB_STEP_SUMMARY

          # Post analysis as PR comment
          ANALYSIS_CONTENT=$(echo '$ANALYSIS' | jq -r '.[]' 2>/dev/null || echo "Analysis completed. Manual review may be needed.")

          COMMENT_BODY=$(cat <<EOF
## MiniMax AI Fix Analysis

### 识别的问题

$ANALYSIS_CONTENT

### 建议的处理方式

1. 优先修复高严重性问题
2. 仔细检查 KMP source-set 边界
3. 确保 Compose 性能优化
4. 添加必要的测试覆盖

---
*This analysis was generated by MiniMax AI*
EOF
          )

          curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $(echo $COMMENT_BODY | jq -Rs .)}"

      - name: Push fixes
        if: steps.analyze.outputs.response && github.event.comment.user.login != 'dependabot[bot]'
        run: |
          # Note: Actual code fixes would require more complex AI agent integration
          # This workflow provides AI-generated analysis and recommendations
          echo "AI analysis complete. Check PR comments for recommendations."

          # If fixes were auto-applied in previous steps, push them:
          # git add -A
          # git commit -m "fix: apply AI recommendations from review"
          # git push

      - name: Summary
        if: always()
        run: |
          echo "## AI Fix Summary" >> $GITHUB_STEP_SUMMARY
          echo "- PR: #${{ github.event.issue.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Comment by: ${{ github.event.comment.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY