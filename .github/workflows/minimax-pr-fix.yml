name: AI Fix (MiniMax)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

env:
  MINIMAX_BASE_URL: "https://api.minimax.chat/v1"
  MINIMAX_MODEL: "MiniMax-Text-01"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@minimax fix') &&
      github.event.comment.user.login != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        run: |
          PR_DATA=$(curl -s "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
          echo "base_ref=$(echo $PR_DATA | jq -r '.base.ref')" >> $GITHUB_OUTPUT
          echo "head_ref=$(echo $PR_DATA | jq -r '.head.ref')" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        run: |
          git fetch origin ${{ steps.pr_info.outputs.base_ref }}
          git checkout ${{ steps.pr_info.outputs.head_ref }}

      - name: Get diff
        run: |
          DIFF=$(git diff origin/${{ steps.pr_info.outputs.base_ref }}...HEAD -- '*.kt' '*.kts' | head -c 80000)
          echo "$DIFF" > /tmp/pr_diff.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write script
        env:
          PR_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python3 -c "
import os
script = open('/tmp/fix.py', 'w')
script.write('''import os, json, urllib.request

base_url = os.environ[\\\"MINIMAX_BASE_URL\\\"]
model = os.environ[\\\"MINIMAX_MODEL\\\"]
api_key = os.environ[\\\"MINIMAX_API_KEY\\\"]

with open(\\\"/tmp/pr_diff.txt\\\", \\\"r\\\") as f:
    diff = f.read()

pr_title = os.environ[\\\"PR_TITLE\\\"]
comment_body = os.environ[\\\"COMMENT_BODY\\\"]
pr_number = os.environ[\\\"PR_NUMBER\\\"]
repo = os.environ[\\\"REPO\\\"]

prompt = \\\"你是 Kotlin Multiplatform 项目的代码修复专家。请分析以下 PR 的问题和修复建议。\\\\n\\\\nPR 标题: \\\" + pr_title + \\\"\\\\n评论内容: \\\" + comment_body + \\\"\\\\n\\\\n代码变更：\\\\n\\\" + diff + \\\"\\\\n\\\\n请：\\\\n1. 识别 PR 中的关键问题\\\\n2. 提供具体的代码修复建议\\\\n3. 解释每个修复的原因\\\\n\\\\n请以 Markdown 格式输出：识别的问题列表（按严重性分类）、修复优先级、需要注意的事项。仅分析 Kotlin 文件。\\\"

messages = [
    {\\\"role\\\": \\\"system\\\", \\\"content\\\": \\\"你是 Kotlin Multiplatform 和 Jetpack Compose 专家。\\\"},
    {\\\"role\\\": \\\"user\\\", \\\"content\\\": prompt}
]

payload = {\\\"model\\\": model, \\\"messages\\\": messages, \\\"temperature\\\": 0.3, \\\"max_tokens\\\": 4000}

req = urllib.request.Request(
    base_url + \\\"/chat/completions\\\",
    data=json.dumps(payload).encode(\\\"utf-8\\\"),
    headers={\\\"Authorization\\\": \\\"Bearer \\\" + api_key, \\\"Content-Type\\\": \\\"application/json\\\"},
    method=\\\"POST\\\"
)

with urllib.request.urlopen(req, timeout=60) as resp:
    result = json.loads(resp.read().decode(\\\"utf-8\\\"))
    content = result.get(\\\"choices\\\", [{}])[0].get(\\\"message\\\", {}).get(\\\"content\\\", \\\"\\\")
    body = \\\"## MiniMax AI Fix Analysis\\\\n\\\\n\\\" + content + \\\"\\\\n\\\\n### 建议的处理方式\\\\n\\\\n1. 优先修复高严重性问题\\\\n2. 仔细检查 KMP source-set 边界\\\\n3. 确保 Compose 性能优化\\\\n4. 添加必要的测试覆盖\\\\n\\\\n---\\\\n*This analysis was generated by MiniMax AI*\\\\n\\\"
    comment_req = urllib.request.Request(
        \\\"https://api.github.com/repos/\\\" + repo + \\\"/issues/\\\" + pr_number + \\\"/comments\\\",
        data=json.dumps({\\\"body\\\": body}).encode(\\\"utf-8\\\"),
        headers={\\\"Authorization\\\": \\\"token \\\" + os.environ[\\\"GITHUB_TOKEN\\\"], \\\"Content-Type\\\": \\\"application/json\\\"},
        method=\\\"POST\\\"
    )
    with urllib.request.urlopen(comment_req) as comment_resp:
        print(\\\"Comment posted\\\")
''')
script.close()
"
          python3 /tmp/fix.py

      - name: Summary
        if: always()
        run: |
          echo "## AI Fix Summary" >> $GITHUB_STEP_SUMMARY
          echo "- PR: #${{ github.event.issue.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Comment by: ${{ github.event.comment.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY