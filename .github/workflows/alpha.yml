# .github/workflows/alpha.yml
#
# Publishes alpha snapshots of every KMP library module to GitHub Packages
# on every push to main. Consumers (yuanjingtech/*) can resolve these
# snapshots by adding https://maven.pkg.github.com/yuanjingtech/boot-app-kmp
# as a repository — see settings.gradle.kts for the matching consumer-side
# config.
#
# The alpha workflow and the Maven Central release workflow are intentionally
# kept on separate code paths: this file sets `project.publish_to_github_packages=true`
# to route Gradle's `publishTo...` target at GitHub Packages instead of Maven
# Central. A misconfigured alpha run cannot accidentally publish to Maven
# Central because that property is only true on alpha runs.
#
# Authentication:
#   - The repository's default `GITHUB_TOKEN` (auto-provided by GitHub
#     Actions) authenticates publishing via `ORG_GRADLE_PROJECT_githubPackagesUsername`
#     and `ORG_GRADLE_PROJECT_githubPackagesPassword`.
#   - For a private repo this works out of the box. For a public repo, the
#     token's package-write scope must be granted at the org/repo level.
#
# Required secrets: none beyond the implicit GITHUB_TOKEN.

name: Publish Alpha

on:
  push:
    branches: [ main ]
  # Allow manual re-runs from the Actions tab without a fresh push.
  workflow_dispatch:

# Cancel in-flight runs on a new push so we don't double-publish.
concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # `contents: read` for checkout. `packages: write` is required to publish
  # to GitHub Packages under the auto-provided GITHUB_TOKEN.
  contents: read
  packages: write

jobs:
  alpha:
    name: Build & publish alpha snapshot to GitHub Packages
    # macOS runner is required: feature:ad declares a `swiftPMImport` cinterop
    # on iosArm64/iosSimulatorArm64 targets, which cannot cross-compile on
    # Linux. macOS also gives us the Xcode toolchain needed for KMP's iOS
    # framework binaries. This matches the historical publish.yml that ran
    # on macOS-latest.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build first, fail fast before we touch the package registry.
      # `:app:composeApp` is a KMP Android Library module — AGP-KMP exposes
      # `assemble` (not `assembleDebug`) because each target has its own
      # binary artifact. We use `linkDebugFrameworkIosArm64` for iOS as it
      # produces the actual `.framework` artifact we ship.
      - name: Build (Android)
        run: ./gradlew :app:composeApp:assemble
        timeout-minutes: 25

      - name: Build (iOS)
        run: ./gradlew :app:composeApp:linkDebugFrameworkIosArm64
        timeout-minutes: 25

      - name: Build (Web)
        run: ./gradlew :app:composeApp:wasmJsBrowserDistribution
        timeout-minutes: 25

      - name: Unit Tests
        run: ./gradlew :app:composeApp:testDebugUnitTest --continue
        timeout-minutes: 25

      # Publish every publication to GitHub Packages. We pass two flags:
      #   -Pproject.build_number=alpha.<run_number>   — unique snapshot version
      #   -Pproject.publish_to_github_packages=true   — switch the publish target
      #     (see root build.gradle.kts)
      #
      # `publishAllPublicationsToGithubPackagesRepository` is the task
      # vanniktech generates for any maven repo named "githubPackages" in
      # `publishing.repositories`. It walks every module's publications
      # (sources, javadoc, aar, klib, etc.) and uploads them.
      - name: Publish to GitHub Packages
        env:
          # GITHUB_TOKEN is auto-provided by GitHub Actions on every run.
          # vanniktech's plugin reads these env-var names and wires them as
          # the maven repository's `username` / `password` credentials.
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew \
            publishAllPublicationsToGithubPackagesRepository \
            --no-configuration-cache \
            -Pproject.build_number=alpha.${{ github.run_number }} \
            -Pproject.publish_to_github_packages=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-test-reports-${{ github.run_id }}
          path: app/composeApp/build/reports/tests/
          retention-days: 7