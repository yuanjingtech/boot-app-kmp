name: Build & Test

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ⚠️⚠️ 这里原来的三条命令**全是坏的**（不只是路径过时，任务名也不存在）：
      #   `:composeApp:assembleDebug`      → 模块路径过时 **且** KMP 模块没有这个任务
      #   `:composeApp:wasmJsBrowserDebug` → 同上
      #   `:composeApp:testDebugUnitTest`  → `testDebugUnitTest` 是 **Android 模块**才有的任务
      # ⇒ ⇒ 每个 PR 都在这里红。
      # ⇒ 下面每个任务都用 `./gradlew <task> --dry-run` **实测存在**才写进来。
      - name: Build Android
        run: ./gradlew :app:androidApp:assembleDebug
        timeout-minutes: 20

      - name: Build iOS
        run: ./gradlew :app:composeApp:linkDebugFrameworkIosArm64
        timeout-minutes: 20

      - name: Build Web
        run: ./gradlew :app:webApp:wasmJsBrowserDistribution
        timeout-minutes: 20

      # ⚠️ `composeApp` 是 KMP 模块 ⇒ **没有** `testDebugUnitTest`（那是 Android 模块才有的）
      #    ⇒ 正确写法是 `:app:composeApp:jvmTest`（KMP 的 JVM 目标）。
      # ⚠️⚠️ **所有有测试源的模块都要跑** —— 只跑 composeApp 的话只跑了 **1** 个用例，
      #    `:shared` / `:network` / `:webview-parkwoocheol` 全都没进 CI。
      #    ⚠️ `:webview` 从 T2.8 起也有测试源了（进度条判据 5 例）⇒ 一并加进来。
      - name: Unit Tests
        run: >-
          ./gradlew
          :app:composeApp:jvmTest
          :shared:jvmTest
          :network:jvmTest
          :webview-parkwoocheol:jvmTest
          :webview:jvmTest
          --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          # ⚠️ 用 `**/` 兜住所有模块的测试报告 —— 原来只指 composeApp 一个模块，
          #    其它模块的用例跑完也不会被上传。
          path: '**/build/reports/tests/'
          retention-days: 7