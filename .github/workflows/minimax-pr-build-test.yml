name: Build & Test

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        run: ./gradlew :composeApp:assembleDebug
        timeout-minutes: 20

      - name: Build iOS
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64
        timeout-minutes: 20

      - name: Build Web
        run: ./gradlew :composeApp:wasmJsBrowserDebug
        timeout-minutes: 20

      - name: Unit Tests
        run: ./gradlew :composeApp:testDebugUnitTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: composeApp/build/reports/tests/
          retention-days: 7